[base]
    introduce = "case-1" ;测试配置说明
    cores_cnt   = 4 ;测试用核心个数

[ring]
    ring_type = "bbq" ;测试使用的ring buffer类型， dpdk/bbq...
    workload    = "simple" ;负载模式 simple/complex
    entries_cnt = 32768 ;ring初始化时分配entry的个数
    producer_cnt = 10 ;生产者个数
    consumer_cnt = 10 ;消费者个数

[run]
    run_time = 0 ; 整体运行的秒数，大于0生效
    enqueue_cnt  = 20000 ;每个线程入队次数，大于0生效
    dequeue_cnt  = 20000 ;每个线程出队次数，大于0生效