[base]
    introduce = "case-1" ;测试配置说明
    ring_type = "dpdk" ;测试使用的ring buffer类型， dpdk/bbq...
    workload    = "simple" ;负载模式 simple/complex
    cores_cnt   = 8 ;测试用核心个数
    entries_cnt = 1024 ;ring初始化时分配entry的个数
    producer_cnt = 2 ;生产者个数
    consumer_cnt = 2 ;消费者个数
    enqueue_cnt  = 200000 ;每个线程入队次数
    dequeue_cnt  = 100000 ;每个线程出队次数