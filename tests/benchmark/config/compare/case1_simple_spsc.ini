[base]
    introduce = "case1 bbq简单负载下，单生产者、单消费者 吞吐测试" ;测试配置说明
    cores_cnt   = 8 ;测试用核心个数

[ring]
    workload    = "simple" ;负载模式 simple/complex
    entries_cnt = 32768 ;ring初始化时分配entry的个数
    producer_cnt = 1 ;生产者个数
    consumer_cnt = 1 ;消费者个数

[run]
    run_time = 20 ; 整体运行的秒数，大于0生效
    enqueue_cnt  = 0 ;每个线程入队次数，大于0生效
    dequeue_cnt  = 0 ;每个线程出队次数，大于0生效